<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wardaditos</title>
<style>
  :root {
    --bg: #14231f;
    --panel: #1c2f29;
    --panel-border: #2c463c;
    --text: #eaf2ed;
    --text-dim: #9fb8ac;
    --accent: #d9a441;
    --accent-soft: rgba(217, 164, 65, 0.14);
    --positivo: #7fbf8f;
    --negativo: #c97b6a;
    --font-display: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding: 32px 16px 80px;
    min-height: 100vh;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  header { margin-bottom: 28px; }

  h1 {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 400;
    margin: 0 0 4px;
    letter-spacing: 0.3px;
  }

  .subtitulo { color: var(--text-dim); font-size: 0.92rem; margin: 0; }

  .total-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 20px;
  }

  .total-label {
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin: 0 0 6px;
  }

  .total-monto {
    font-family: var(--font-display);
    font-size: 2.4rem;
    color: var(--accent);
    margin: 0;
  }

  .saldos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }

  .saldo-item {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .saldo-nombre { font-size: 0.78rem; color: var(--text-dim); margin: 0 0 4px; }
  .saldo-valor { font-size: 1.15rem; font-weight: 600; margin: 0; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 22px;
  }

  .panel h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 1.2rem;
    margin: 0 0 16px;
  }

  form { display: flex; flex-direction: column; gap: 12px; }

  label {
    font-size: 0.78rem;
    color: var(--text-dim);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  input, select {
    background: #0f1c18;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.95rem;
    font-family: var(--font-body);
  }

  input:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .tipo-toggle { display: flex; gap: 8px; }

  .tipo-toggle button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--text-dim);
    font-size: 0.88rem;
    cursor: pointer;
  }

  .tipo-toggle button.activo[data-tipo="Depósito"] {
    background: var(--accent-soft);
    border-color: var(--positivo);
    color: var(--positivo);
  }

  .tipo-toggle button.activo[data-tipo="Retiro"] {
    background: var(--accent-soft);
    border-color: var(--negativo);
    color: var(--negativo);
  }

  button[type="submit"] {
    margin-top: 6px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    color: #1c1206;
    cursor: pointer;
  }

  button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }

  .mensaje { font-size: 0.85rem; margin-top: 4px; min-height: 1.2em; }
  .mensaje.ok { color: var(--positivo); }
  .mensaje.error { color: var(--negativo); }

  .historial-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 0.88rem;
  }

  .historial-item:last-child { border-bottom: none; }

  .historial-izq .wardadito { font-weight: 600; }
  .historial-izq .fecha { color: var(--text-dim); font-size: 0.78rem; }
  .historial-monto.Depósito { color: var(--positivo); }
  .historial-monto.Retiro { color: var(--negativo); }

  .vacio { color: var(--text-dim); font-size: 0.88rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Wardaditos</h1>
    <p class="subtitulo">Tus ahorros, aparte del presupuesto y de Trii.</p>
  </header>

  <div class="total-card">
    <p class="total-label">Saldo total ahorrado</p>
    <p class="total-monto" id="saldoTotal">S/ —</p>
  </div>

  <div class="saldos-grid" id="saldosGrid"></div>

  <div class="panel">
    <h2>Registrar movimiento</h2>
    <form id="formMovimiento">
      <label>
        Wardadito
        <input type="text" id="wardadito" placeholder="Ej: BCP, Yape, efectivo en casa" required>
      </label>

      <label>
        Tipo
        <div class="tipo-toggle" id="tipoToggle">
          <button type="button" data-tipo="Depósito" class="activo">Depósito</button>
          <button type="button" data-tipo="Retiro">Retiro</button>
        </div>
      </label>

      <label>
        Monto
        <input type="number" id="monto" min="0.01" step="0.01" placeholder="0.00" required>
      </label>

      <label>
        Nota (opcional)
        <input type="text" id="nota" placeholder="Ej: sobrante del mes">
      </label>

      <button type="submit" id="btnGuardar">Guardar movimiento</button>
      <p class="mensaje" id="mensaje"></p>
    </form>
  </div>

  <div class="panel">
    <h2>Historial reciente</h2>
    <div id="historial"><p class="vacio">Cargando...</p></div>
  </div>
</div>

<script>
  // Reemplaza esta URL por la de TU implementación de Apps Script (termina en /exec)
  const API_URL = 'https://script.google.com/macros/s/AKfycby4f5S-Od0N9FcXXJA3OXgl8UsCPRSKtiB-lPNOahDyGCHl8ldSO9SFNnZ-2_wXhR30/exec';

  let tipoSeleccionado = 'Depósito';

  document.querySelectorAll('#tipoToggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      tipoSeleccionado = btn.dataset.tipo;
      document.querySelectorAll('#tipoToggle button').forEach(b => b.classList.remove('activo'));
      btn.classList.add('activo');
    });
  });

  function formatearMonto(valor) {
    const signo = valor < 0 ? '-' : '';
    return signo + 'S/ ' + Math.abs(valor).toFixed(2);
  }

  async function cargarDatos() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();

      const saldosGrid = document.getElementById('saldosGrid');
      const saldoTotalEl = document.getElementById('saldoTotal');
      const historialEl = document.getElementById('historial');

      const wardaditos = Object.keys(data.saldos || {});
      const total = wardaditos.reduce((acc, w) => acc + data.saldos[w], 0);
      saldoTotalEl.textContent = formatearMonto(total);

      if (wardaditos.length === 0) {
        saldosGrid.innerHTML = '<p class="vacio">Aún no registras wardaditos.</p>';
      } else {
        saldosGrid.innerHTML = wardaditos.map(w => `
          <div class="saldo-item">
            <p class="saldo-nombre">${w}</p>
            <p class="saldo-valor">${formatearMonto(data.saldos[w])}</p>
          </div>
        `).join('');
      }

      const movimientos = (data.movimientos || []).slice(0, 15);
      if (movimientos.length === 0) {
        historialEl.innerHTML = '<p class="vacio">Sin movimientos todavía.</p>';
      } else {
        historialEl.innerHTML = movimientos.map(m => `
          <div class="historial-item">
            <div class="historial-izq">
              <div class="wardadito">${m.wardadito}${m.nota ? ' · ' + m.nota : ''}</div>
              <div class="fecha">${new Date(m.fecha).toLocaleDateString('es-PE', {day:'numeric', month:'short', year:'numeric'})}</div>
            </div>
            <div class="historial-monto ${m.tipo}">${m.tipo === 'Retiro' ? '-' : '+'}S/ ${Number(m.monto).toFixed(2)}</div>
          </div>
        `).join('');
      }
    } catch (err) {
      document.getElementById('historial').innerHTML = '<p class="vacio">No se pudo cargar. Revisa la URL de la API.</p>';
    }
  }

  document.getElementById('formMovimiento').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnGuardar');
    const mensaje = document.getElementById('mensaje');
    btn.disabled = true;
    mensaje.textContent = '';
    mensaje.className = 'mensaje';

    const payload = {
      wardadito: document.getElementById('wardadito').value.trim(),
      tipo: tipoSeleccionado,
      monto: document.getElementById('monto').value,
      nota: document.getElementById('nota').value.trim()
    };

    try {
      // Content-Type text/plain evita el preflight CORS con Apps Script Web Apps
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.status === 'ok') {
        mensaje.textContent = 'Movimiento guardado.';
        mensaje.classList.add('ok');
        e.target.reset();
        cargarDatos();
      } else {
        mensaje.textContent = data.mensaje || 'No se pudo guardar.';
        mensaje.classList.add('error');
      }
    } catch (err) {
      mensaje.textContent = 'Error de conexión con la API.';
      mensaje.classList.add('error');
    } finally {
      btn.disabled = false;
    }
  });

  cargarDatos();
</script>
</body>
</html>
